spring.config.import=aws-secretsmanager:dazma/prod/database?prefix=db.;dazma/prod/firebase?prefix=firebase.
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.url=jdbc:postgresql://${db.host}:${db.port}/${db.dbname}
dazma.firebase.service-account=${firebase.serviceAccount}
spring.cloud.aws.secretsmanager.enabled=true