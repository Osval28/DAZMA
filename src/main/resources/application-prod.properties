spring.config.import=aws-secretsmanager:dazma/prod/database?prefix=db.;dazma/prod/firebase?prefix=firebase.;dazma/prod/r2?prefix=r2.;dazma/prod/observability?prefix=observability.;dazma/prod/resend?prefix=resend.,aws-parameterstore:/dazma/prod/
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.url=jdbc:postgresql://${db.host}:${db.port}/${db.dbname}
dazma.firebase.service-account=${firebase.serviceAccount}
spring.cloud.aws.secretsmanager.enabled=true
dazma.storage.r2.endpoint=https://cde805e3f6c20c31bd7f2a77e6e0cc24.r2.cloudflarestorage.com
dazma.storage.r2.bucket-name=dazmaimages
dazma.storage.r2.access-key-id=${r2.accessKeyId}
dazma.storage.r2.secret-access-key=${r2.secretAccessKey}
firebase.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${observability.otlpEndpoint}/v1/traces
management.opentelemetry.tracing.export.otlp.headers.Authorization=${observability.otlpAuthorization}

management.otlp.metrics.export.url=${observability.otlpEndpoint}/v1/metrics
management.otlp.metrics.export.headers.Authorization=${observability.otlpAuthorization}

management.opentelemetry.logging.export.otlp.endpoint=${observability.otlpEndpoint}/v1/logs
management.opentelemetry.logging.export.otlp.headers.Authorization=${observability.otlpAuthorization}

logging.structured.format.console=logstash

dazma.cors.allowed-origins=https://app.dazma.store
dazma.csrf.cookie-domain=dazma.store
spring.cloud.aws.parameterstore.enabled=true
dazma.notifications.resend.api-key=${resend.apiKey}
spring.modulith.runtime.verification-enabled=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
