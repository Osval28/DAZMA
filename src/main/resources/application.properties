spring.application.name=DAZMA
server.port=${PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dazma}
spring.datasource.username=${DB_USERNAME:dazma}
spring.datasource.password=${DB_PASSWORD:dazma}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.runtime.verification-enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
