spring.application.name=DAZMA
server.port=${PORT:8080}
server.shutdown=graceful

spring.jpa.properties.hibernate.jdbc.time_zone = UTC
spring.cloud.aws.secretsmanager.enabled=false
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.runtime.verification-enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

management.health.redis.enabled=false

spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

dazma.cache.publications.key-prefix=dazma:publications:v1:
dazma.cache.publications.ttl=10m
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[deployment.environment.name]=${DAZMA_ENVIRONMENT:local}

management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.otlp.metrics.export.step=${OTEL_METRIC_EXPORT_INTERVAL:60s}

logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}] 
logging.include-application-name=false
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.co.dazma.api=${DAZMA_LOG_LEVEL:INFO}


dazma.publications.photo-upload.allowed-content-types=image/jpeg,image/png,image/webp
dazma.publications.photo-upload.maximum-size=5MB
dazma.publications.photo-upload.validity=5m
dazma.notifications.resend.sender=DAZMA <no-reply@notificaciones.dazma.store>
dazma.notifications.resend.connect-timeout=5s
dazma.notifications.resend.read-timeout=10s
firebase.enabled=false
spring.cloud.aws.parameterstore.enabled=false
dazma.session.validity=PT8H
dazma.session.maximum-sign-in-age=PT5M
dazma.cors.allowed-origins=
dazma.csrf.cookie-domain=
