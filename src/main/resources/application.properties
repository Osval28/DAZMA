spring.application.name=DAZMA
server.port=${PORT:8080}
server.shutdown=graceful

spring.jpa.properties.hibernate.jdbc.time_zone = UTC
spring.cloud.aws.secretsmanager.enabled=false
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.runtime.verification-enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

dazma.storage.r2.enabled=${R2_ENABLED:false}
dazma.storage.r2.endpoint=${R2_ENDPOINT:}
dazma.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
dazma.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
dazma.storage.r2.bucket-name=${R2_BUCKET_NAME:}

dazma.publications.photo-upload.allowed-content-types=${PUBLICATION_PHOTO_ALLOWED_CONTENT_TYPES:}
dazma.publications.photo-upload.maximum-size=${PUBLICATION_PHOTO_MAXIMUM_SIZE:}
dazma.publications.photo-upload.validity=${PUBLICATION_PHOTO_UPLOAD_VALIDITY:}

firebase.enabled=${FIREBASE_ENABLED:false}
