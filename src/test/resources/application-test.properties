firebase.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
dazma.storage.r2.endpoint=https://test-account.r2.cloudflarestorage.com
dazma.storage.r2.bucket-name=test-bucket
dazma.storage.r2.access-key-id=test-access-key
dazma.storage.r2.secret-access-key=test-secret-key
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
dazma.notifications.resend.api-key=test-api-key
dazma.chats.ably.api-key=test-app.test-key:test-secret
dazma.publications.photo-upload.allowed-content-types=image/jpeg,image/png,image/webp
dazma.publications.photo-upload.maximum-size=5MB
dazma.publications.photo-upload.validity=5m
dazma.publications.photo-download.validity=10m
dazma.chats.ably.token-validity=1h
dazma.chats.ably.room-namespace=dazma-chat
dazma.users.phone.country-code=57
dazma.users.phone.national-length=10
dazma.users.phone.mobile-prefix=3
dazma.publications.rules.maximum-photos=5
dazma.publications.rules.maximum-page-size=50
dazma.publications.rules.default-page-size=20

# Valores que en prod vienen de Parameter Store (/dazma/prod/)
dazma.cache.publications.ttl=10m
dazma.session.validity=PT8H
dazma.session.maximum-sign-in-age=PT5M
dazma.notifications.resend.sender=DAZMA <no-reply@notificaciones.dazma.store>
dazma.notifications.resend.connect-timeout=5s
dazma.notifications.resend.read-timeout=10s
dazma.notifications.email-executor.threads=4
dazma.notifications.email-executor.queue-capacity=100
dazma.notifications.email-executor.shutdown-timeout=30s
dazma.events.resubmission.interval=PT5M
dazma.events.resubmission.min-age=PT2M
dazma.events.resubmission.max-attempts=5
dazma.events.resubmission.batch-size=50
