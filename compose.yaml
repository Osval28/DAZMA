services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dazma
      POSTGRES_USER: dazma
      POSTGRES_PASSWORD: dazma
    ports:
      - "5432:5432"
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"